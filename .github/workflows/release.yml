# Builds the Windows installer and exe whenever a version tag is pushed,
# then publishes them on a GitHub Release for that tag.
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# The version inside the app is taken from the tag, so there is no need to
# edit package.json, Cargo.toml or tauri.conf.json before releasing.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set app version from tag
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' is not a version like v1.2.3"
          }
          node scripts/set-version.mjs $version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # With the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD
      # repository secrets, the installer is signed and latest.json (the feed the
      # app's silent updater reads) is published. Without them the release is
      # still built, just without the update feed.
      - name: Choose signed or unsigned build
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_KEY -eq 'true') {
            "TAURI_ARGS=--config src-tauri/tauri.release.conf.json" >> $env:GITHUB_ENV
            "UPDATER_JSON=true" >> $env:GITHUB_ENV
          } else {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, so this release has no auto-update feed."
            "TAURI_ARGS=" >> $env:GITHUB_ENV
            "UPDATER_JSON=false" >> $env:GITHUB_ENV
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ env.TAURI_ARGS }}
          includeUpdaterJson: ${{ env.UPDATER_JSON == 'true' }}
          tagName: ${{ env.TAG }}
          releaseName: Notepadly ${{ env.TAG }}
          releaseBody: |
            Notepadly ${{ env.APP_VERSION }} for Windows 10 and 11 (64-bit).

            ### Download
            - **Notepadly_${{ env.APP_VERSION }}_x64-setup.exe**: the installer (recommended). Run it; no admin rights needed. It keeps itself up to date.
            - **Notepadly_${{ env.APP_VERSION }}_x64-portable.zip**: no install. Unzip anywhere and run `notepadly.exe`.

            Windows may show "Windows protected your PC" because the app is new and not code-signed. Click **More info → Run anyway**.

            ### Highlights
            - The Windows 11 Notepad look with a live Markdown editor inside: tables, maths, Mermaid diagrams, callouts and code in 143 languages.
            - Reopens in about 40 ms and opens a 127 MB file in about a second, up to 28× faster than the built-in Notepad.
            - Never locks files, saves safely and brings back unsaved notes after a restart.
          releaseDraft: false
          prerelease: ${{ contains(env.TAG, '-') }}

      - name: Attach the portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "Notepadly"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "src-tauri/target/release/notepadly.exe" "$dir/notepadly.exe"
          Copy-Item LICENSE, NOTICE, README.md $dir
          $zip = "Notepadly_${env:APP_VERSION}_x64-portable.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
