[package]
name = "notepadly"
version = "0.1.0"
description = "A fast Windows notepad with live Markdown"
license = "Apache-2.0"
authors = ["Hamza Javed"]
edition = "2021"

[lib]
name = "notepadly_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-opener = "~2.7"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
# Same versions Tauri's WebView2 layer (wry) already uses, so nothing extra is built.
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
