<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Notepadly: Windows 11 Notepad's shape (192x256), formatted lines and a pencil.
       Edit this file, then run `npm run icons` to regenerate every PNG and icon.ico. -->
  <defs>
    <linearGradient id="cover" x1="32" y1="16" x2="224" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd7f1"/><stop offset="1" stop-color="#45b0d1"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="200" x2="0" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9c9c9"/><stop offset="0.45" stop-color="#f3f3f3"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="226" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e3a17"/><stop offset="0.4" stop-color="#ad602a"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="-15" x2="0" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd659"/><stop offset="0.5" stop-color="#ffc226"/><stop offset="1" stop-color="#f29d0a"/>
    </linearGradient>
  </defs>

  <!-- back cover, paper edge, front cover -->
  <rect x="32" y="196" width="192" height="60" rx="14" fill="url(#back)"/>
  <rect x="32" y="190" width="192" height="46" rx="14" fill="url(#paper)"/>
  <rect x="32" y="16" width="192" height="196" rx="14" fill="url(#cover)"/>

  <!-- spiral rings -->
  <g fill="#066f94">
    <rect x="52" y="0" width="20" height="32" rx="10"/><rect x="94" y="0" width="20" height="32" rx="10"/>
    <rect x="142" y="0" width="20" height="32" rx="10"/><rect x="184" y="0" width="20" height="32" rx="10"/>
  </g>

  <!-- formatted text: a heading and two bullet points -->
  <g fill="#066f94">
    <rect x="62" y="58" width="98" height="24" rx="12"/>
    <circle cx="71" cy="117" r="9"/><rect x="92" y="110" width="58" height="14" rx="7"/>
    <circle cx="71" cy="161" r="9"/><rect x="92" y="154" width="20" height="14" rx="7"/>
  </g>

  <!-- pencil, tip pointing down-left -->
  <g transform="translate(156 172) rotate(135)">
    <path d="M-62,-17 H52 L84,0 L52,17 H-62 a10 10 0 0 1 -10 -10 V-7 a10 10 0 0 1 10 -10 Z" fill="#ffffff" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
    <path d="M-62,-15 H-44 V15 H-62 a8 8 0 0 1 -8 -8 V-7 a8 8 0 0 1 8 -8 Z" fill="#ef6f6c"/>
    <rect x="-44" y="-15" width="12" height="30" fill="#b9c3cd"/>
    <rect x="-32" y="-15" width="84" height="30" fill="url(#pencil)"/>
    <path d="M52,-15 L80,0 L52,15 Z" fill="#f4d3a4"/>
    <path d="M70,-5.4 L80,0 L70,5.4 Z" fill="#3b3b3b"/>
  </g>
</svg>
