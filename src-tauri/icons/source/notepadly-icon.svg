<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="cover" x1="225" y1="150" x2="975" y2="925" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd7f1"/>
      <stop offset="1" stop-color="#45b0d1"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="900" x2="0" y2="1075" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6e3a17"/>
      <stop offset="0.45" stop-color="#ad602a"/>
      <stop offset="1" stop-color="#ad602a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="880" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="0.4" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#f3f3f3"/>
    </linearGradient>
    <linearGradient id="badge" x1="610" y1="740" x2="1150" y2="1130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
  </defs>

  <!-- back cover and paper edge -->
  <rect x="225" y="850" width="750" height="225" rx="50" fill="url(#back)"/>
  <rect x="225" y="820" width="750" height="180" rx="50" fill="url(#paper)"/>

  <!-- front cover -->
  <rect x="225" y="150" width="750" height="775" rx="50" fill="url(#cover)"/>

  <!-- spiral rings -->
  <g fill="#066f94">
    <rect x="300" y="100" width="75" height="125" rx="37.5"/>
    <rect x="475" y="100" width="75" height="125" rx="37.5"/>
    <rect x="650" y="100" width="75" height="125" rx="37.5"/>
    <rect x="825" y="100" width="75" height="125" rx="37.5"/>
  </g>

  <!-- text lines -->
  <g fill="#066f94">
    <rect x="325" y="400" width="550" height="75" rx="12"/>
    <rect x="325" y="550" width="550" height="75" rx="12"/>
    <rect x="325" y="700" width="350" height="75" rx="12"/>
  </g>

  <!-- Markdown badge: marks this as Notepadly, not the Windows Notepad -->
  <rect x="610" y="760" width="540" height="370" rx="80" fill="#ffffff"/>
  <rect x="640" y="790" width="480" height="310" rx="58" fill="url(#badge)"/>
  <g fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="705,1030 705,860 800,955 895,860 895,1030"/>
    <line x1="1010" y1="860" x2="1010" y2="1025"/>
    <polyline points="955,972 1010,1030 1065,972"/>
  </g>
</svg>
